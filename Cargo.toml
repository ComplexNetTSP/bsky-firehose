[package]
name = "bsky-firehose"
version = "0.1.0"
edition = "2024"
rust-version = "1.92.0"
authors = ["Vincent Gauthier <vincent.gauthier@telecom-sudparis.eu>"]

[dependencies]
anyhow = "1.0.102"
arrow = "58.3.0"
atrium-api = "0.25.8"
base64 = "0.22.1"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"] }
futures = "0.3.32"
ipld-core = "0.4.3"
parquet = "58.3.0"
rs-car-sync = "0.5.1"
serde = "1.0.228"
serde_ipld_dagcbor = "0.6.4"
serde_json = "1.0.150"
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = { version = "0.20", features = ["native-tls"] }
